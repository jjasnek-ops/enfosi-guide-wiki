name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Rapid pushes to the same PR cancel the outdated run instead of stacking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # pnpm/action-setup installs pnpm WITHOUT running it, so it works
      # even before Node is configured (runs on the action's own Node).
      # No `version:` input on purpose — the action reads it from the
      # packageManager field of package.json, so an upgrade edits one file
      # (pinned by tests/workflows.test.ts).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The eight gates (lint → typecheck → test → check-config → build →
      # check-content → check-links → check-i18n) live in one composite
      # action so the auto-content pipeline verifies drafts with the exact
      # same definition before opening a PR.
      - name: Quality gates
        uses: ./.github/actions/gates
        with:
          site-url: ${{ vars.SITE_URL || 'https://anvil.wiki' }}

      - name: Published-site audit
        run: node scripts/audit-site.mjs
